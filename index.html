<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heroes Wanted</title>
<style>
:root{color-scheme:dark;--text:#f4f6ff;--sub:#b6bdd8;--gold:#ffc83d;--orange:#ff7a2f;--cyan:#35e0ff;--card:rgba(16,18,40,.5);--line:rgba(255,255,255,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#070a1c;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}
.sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#070a1c 0%,#1a1546 45%,#5a2a6e 78%,#d9567a 100%)}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 16s ease-in-out infinite alternate}
.b1{background:#6a3dff;left:-20vmax;top:-15vmax}
.b2{background:#ff4f8b;right:-22vmax;bottom:-10vmax;animation-delay:-6s}
.beam{position:absolute;bottom:0;width:26vmax;height:90vh;transform-origin:50% 100%;background:linear-gradient(0deg,rgba(255,255,255,.22),transparent 85%);clip-path:polygon(46% 100%,54% 100%,100% 0,0 0);animation:sweep 7s ease-in-out infinite alternate}
.beam.l{left:8%;--a:-28deg;--b:10deg}
.beam.r{right:8%;--a:28deg;--b:-10deg;animation-delay:-3s}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite}
.spark{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:rise linear infinite}
#city{position:fixed;left:0;right:0;bottom:0;width:100%;height:30vh;min-height:150px;z-index:1;display:block}
.card{position:relative;z-index:2;background:var(--card);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border:1px solid var(--line);border-radius:26px;max-width:430px;width:100%;padding:26px 24px 30px;text-align:center;box-shadow:0 0 50px rgba(106,61,255,.35),0 20px 60px rgba(0,0,0,.45)}
.badge{display:inline-block;font-size:12px;letter-spacing:.2em;color:var(--gold);border:1px solid rgba(255,200,61,.5);padding:4px 12px;border-radius:999px;margin-bottom:12px}
.bubble{display:inline-block;background:rgba(255,255,255,.12);border:1px solid var(--line);border-radius:16px;padding:8px 16px;font-size:15px;position:relative;margin-bottom:10px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#3a3860;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
svg.bolt{width:220px;max-width:66%;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 18px rgba(53,224,255,.35))}
h1{font-size:28px;margin:8px 0 8px;background:linear-gradient(90deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--sub);line-height:1.7;margin:0 0 22px;font-size:15px}
a.btn{display:inline-block;background:linear-gradient(90deg,var(--gold),var(--orange));color:#2a1200;text-decoration:none;font-weight:800;font-size:18px;padding:15px 36px;border-radius:999px;animation:glow 2s ease-in-out infinite;transition:transform .15s}
a.btn:hover{transform:translateY(-2px) scale(1.05)}
small{display:block;margin-top:14px;color:var(--sub);font-size:12px}
.bob{animation:bob 2.4s ease-in-out infinite}
.wave{transform-origin:226px 186px;animation:wave .9s ease-in-out infinite alternate}
.blink{transform-origin:168px 108px;animation:blink 4s infinite}
.led{animation:led 1.2s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hero{position:fixed;left:0;top:0;z-index:1;pointer-events:none;will-change:transform;animation:fly linear forwards}
.hero svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 8px rgba(255,255,255,.4));animation:hbob 1.6s ease-in-out infinite alternate}
.flap{transform-origin:50px 28px;animation:flap .35s ease-in-out infinite alternate}
#stage{position:fixed;left:0;right:0;top:14vh;width:100%;height:clamp(140px,28vh,230px);z-index:1;pointer-events:none}
#scene{transition:opacity 1s}
#hero{transition:transform 1s ease-out}
#heroR{transform-box:fill-box;transform-origin:center;transition:transform .8s}
#heroR.shake{animation:shake .4s}
.rb{transform-box:fill-box;transform-origin:center;transition:transform .9s ease-in,opacity .9s}
.rbob{animation:rbob 1.4s ease-in-out infinite alternate}
.fl{animation:led .2s infinite}
#laser,#laser2{transition:opacity .1s}
#flip{transform-box:fill-box;transform-origin:center}
#heroR{animation:hbob2 .6s ease-in-out infinite alternate}
@keyframes hbob2{to{transform:translateY(-5px)}}
#fx{opacity:0}
#fx.pop{animation:pop .55s ease-out}
#win{opacity:0;transform-box:fill-box;transform-origin:center}
#win.show{animation:winpop .7s forwards}
@keyframes rbob{to{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{opacity:1;transform:translate(var(--fx),var(--fy)) scale(.2)}100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(1.7)}}
@keyframes winpop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes fly{from{transform:translate3d(var(--x0),var(--y),0)}to{transform:translate3d(var(--x1),var(--y),0)}}
@keyframes hbob{to{transform:translateY(-6px) rotate(-3deg)}}
@keyframes flap{from{transform:scaleY(.5)}to{transform:scaleY(1.1)}}
@keyframes wave{from{transform:rotate(-120deg)}to{transform:rotate(-165deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes led{50%{opacity:.25}}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
@keyframes drift{to{transform:translate(8vmax,6vmax)}}
@keyframes tw{50%{opacity:.15}}
@keyframes rise{to{transform:translateY(-105vh);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 28px rgba(255,200,61,.75)}}
@keyframes flick{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wave{transform:rotate(-140deg)}}
</style>
</head>

    <line id="laser" x1="0" y1="0" x2="0" y2="0" stroke="#ff2d3a" stroke-width="6" stroke-linecap="round" opacity="0"/><line id="laser2" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0"/>
    <g id="fx"><polygon points="0,-26 7,-9 25,-12 12,0 22,16 4,10 0,28 -6,10 -24,16 -12,0 -25,-12 -7,-9" fill="#ffd23f"/><polygon points="0,-13 4,-4 13,-6 6,0 11,8 2,5 0,14 -3,5 -12,8 -6,0 -13,-6 -4,-4" fill="#fff"/></g>
    <text id="win" x="300" y="28" text-anchor="middle" font-size="26" font-weight="800" fill="#ffd23f">VICTORY!</text>
  </g>
</svg>

  document.getElementById("go").href = FORM_URL;

  var sky = document.getElementById("sky"), i, el;
  for (i = 0; i < 70; i++) {
    el = document.createElement("div"); el.className = "star";
    el.style.cssText = "left:" + Math.random()*100 + "%;top:" + Math.random()*65 + "%;animation-delay:-" + Math.random()*3 + "s";

  }
  for (i = 0; i < 14; i++) {
    el = document.createElement("div"); el.className = "spark";
    el.style.cssText = "left:" + Math.random()*100 + "%;animation-duration:" + (7 + Math.random()*8) + "s;animation-delay:-" + Math.random()*12 + "s";
    sky.appendChild(el);
  }

  var city = document.getElementById("city"), x = 0, s = 7, html = "";
  function rnd() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
  while (x < 1200) {
    var w = 40 + rnd()*50, h = 60 + rnd()*110;
    html += '<rect x="' + x + '" y="' + (200-h) + '" width="' + (w-3) + '" height="' + h + '" fill="#0a0b1e"/>';
    for (var wy = 200-h+10; wy < 190; wy += 16) {
      for (var wx = x+6; wx < x+w-12; wx += 12) {
        if (rnd() > 0.62) html += '<rect x="' + wx + '" y="' + wy + '" width="5" height="7" fill="#ffd36b"' + (rnd()>0.8 ? ' style="animation:flick 3s infinite"' : '') + ' opacity=".85"/>';
      }
    }
    x += w;
  }
  city.innerHTML = html;

  // 随机飞过的原创英雄（只用通用特征：披风、装甲、翅膀、光环）
  var H = {
    cape: '<svg viewBox="0 0 120 60"><path d="M42 29 Q16 12 2 20 Q14 28 4 40 Q22 38 42 35Z" fill="#19c3b4"/><rect x="12" y="29" width="30" height="8" rx="4" fill="#2b3a8f"/><rect x="36" y="23" width="40" height="14" rx="7" fill="#ff9a2e"/><rect x="72" y="29" width="30" height="6" rx="3" fill="#ff9a2e"/><circle cx="104" cy="32" r="4.5" fill="#f2c9a0"/><circle cx="80" cy="27" r="8" fill="#f2c9a0"/><rect x="74" y="24" width="13" height="5" rx="2.5" fill="#1d1d2b"/></svg>',

  };
  H = {
    swing: '<svg viewBox="0 -6 120 66"><line x1="90" y1="16" x2="118" y2="-6" stroke="#fff" stroke-width="1.6" opacity=".85"/><path d="M14 40 L36 33 L40 38 L22 46Z" fill="#2b9e5a"/><path d="M30 34 L46 44 L42 49 L28 40Z" fill="#2b9e5a"/><rect x="34" y="24" width="34" height="13" rx="6.5" fill="#ffd23f" transform="rotate(8 50 30)"/><rect x="62" y="27" width="30" height="6" rx="3" fill="#2b9e5a" transform="rotate(-25 62 30)"/><circle cx="90" cy="16" r="4" fill="#ffd23f"/><circle cx="72" cy="28" r="9" fill="#2fbf71"/><path d="M66 26 L74 29 L74 32 L65 30Z" fill="#fff"/><path d="M80 26 L72 29 L73 32 L81 30Z" fill="#fff"/></svg>',
    strong: '<svg viewBox="0 0 120 60"><path d="M44 27 Q20 6 0 14 Q12 22 2 30 Q14 36 4 46 Q28 44 44 35Z" fill="#12b886"/><rect x="14" y="29" width="30" height="8" rx="4" fill="#f4f6ff"/><rect x="36" y="22" width="40" height="15" rx="7" fill="#f4f6ff"/><rect x="36" y="32" width="40" height="4" fill="#ffc83d"/><circle cx="56" cy="28" r="4.5" fill="#ffc83d"/><rect x="72" y="28" width="28" height="7" rx="3.5" fill="#f4f6ff"/><circle cx="103" cy="31.5" r="5" fill="#f2c9a0"/><circle cx="80" cy="26" r="8.5" fill="#f2c9a0"/><path d="M72 22 Q80 14 88 22 Q82 20 80 24 Q78 19 72 22Z" fill="#2a1f1a"/></svg>',

  };
  function runChase2() {
    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), hero = $("hero"), scene = $("scene"), R = [$("r1"), $("r2"), $("r3")];
    var X0 = [-90, -150, -120], Y1 = [30, 100, 62], Y2 = [95, 30, 100];
    function at(el, x, y) { el.style.transform = "translate(" + x + "px," + y + "px)"; }
    function later(ms, f) { setTimeout(f, ms); }
    function cycle() {
      var s = stage.clientHeight / 200, W = stage.clientWidth / s;
      stage.setAttribute("viewBox", "0 0 " + W + " 200");
      var D = W + 450, dur = D / 154, t1 = dur * 0.37;
      scene.style.transition = "none"; scene.style.opacity = 1;
